name: Build and publish x86-64-v2 LTS

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream LTS tag, for example v26.8.34.13-lts"
        required: false
        type: string
      bootstrap_registry:
        description: "Create the GHCR package before its one-time visibility change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: clickhouse-oldcpu-lts-publish
  cancel-in-progress: false

jobs:
  bootstrap-registry:
    name: Initialize the GHCR package
    if: inputs.bootstrap_registry == true
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the registry bootstrap image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/clickhouse-oldcpu"
          mkdir registry-bootstrap
          cat > registry-bootstrap/Dockerfile <<EOF
          FROM busybox:1.37
          LABEL org.opencontainers.image.description="Registry initialization image; use versioned ClickHouse tags for production"
          LABEL org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY"
          EOF
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image:registry-bootstrap" registry-bootstrap
          docker push "$image:registry-bootstrap"

  build-and-publish:
    name: Build, verify, and publish
    if: inputs.bootstrap_registry != true
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out automation files
        uses: actions/checkout@v4
        with:
          path: automation
          sparse-checkout: |
            .github/workflows
            docker/oldcpu
          submodules: false

      - name: Resolve the upstream LTS release
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="$REQUESTED_TAG"
          if [[ -z "$upstream_tag" ]]; then
              upstream_tag="$({
                  gh api "repos/ClickHouse/ClickHouse/releases?per_page=100" \
                      --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-lts$"))'
              } | sort -V | tail -n 1)"
          fi

          if [[ ! "$upstream_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)-lts$ ]]; then
              echo "Invalid upstream LTS tag: $upstream_tag" >&2
              exit 1
          fi

          published_tag="$(gh api "repos/ClickHouse/ClickHouse/releases/tags/$upstream_tag" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name')"
          if [[ "$published_tag" != "$upstream_tag" ]]; then
              echo "The requested tag is not a published upstream LTS release: $upstream_tag" >&2
              exit 1
          fi

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
          series="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          release_tag="v${version}-lts-x86_64-v2"
          asset_name="clickhouse-${version}-lts-linux-x86_64-v2"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clickhouse-oldcpu"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              skip=true
              echo "Release $release_tag already exists; nothing to publish."
          else
              skip=false
          fi

          {
              echo "upstream_tag=$upstream_tag"
              echo "version=$version"
              echo "series=$series"
              echo "release_tag=$release_tag"
              echo "asset_name=$asset_name"
              echo "image=$image"
              echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk space
        if: steps.metadata.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user
          df -h

      - name: Check out upstream source
        if: steps.metadata.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ClickHouse/ClickHouse
          ref: ${{ steps.metadata.outputs.upstream_tag }}
          path: source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Resolve and pull the ClickHouse build environment
        if: steps.metadata.outputs.skip != 'true'
        id: builder
        shell: bash
        run: |
          set -euo pipefail

          builder_tag="$(python3 - <<'PY'
          import ast
          import hashlib
          from pathlib import Path

          source = Path("source")
          definitions = ast.parse((source / "ci/defs/defs.py").read_text())
          configs = {}

          for node in ast.walk(definitions):
              if not isinstance(node, ast.Call):
                  continue
              if not isinstance(node.func, ast.Attribute) or node.func.attr != "Config":
                  continue
              values = {keyword.arg: keyword.value for keyword in node.keywords if keyword.arg}
              if not {"name", "path", "depends_on"}.issubset(values):
                  continue
              try:
                  name = ast.literal_eval(values["name"])
                  path = ast.literal_eval(values["path"])
                  depends_on = ast.literal_eval(values["depends_on"])
              except (ValueError, TypeError):
                  continue
              if isinstance(name, str) and isinstance(path, str) and isinstance(depends_on, list):
                  configs[name] = (path, depends_on)

          target = "clickhouse/binary-builder"
          if target not in configs:
              raise SystemExit(f"Cannot find {target} in ci/defs/defs.py")

          digest = hashlib.md5()

          def add_config(name, active):
              if name in active:
                  raise SystemExit(f"Docker dependency cycle at {name}")
              if name not in configs:
                  raise SystemExit(f"Unknown Docker dependency: {name}")
              path, dependencies = configs[name]
              for dependency in dependencies:
                  add_config(dependency, active | {name})
              root = source / path.removeprefix("./")
              files = sorted(
                  (entry for entry in root.rglob("*") if entry.is_file()),
                  key=lambda entry: str(entry),
                  reverse=True,
              )
              if not files:
                  raise SystemExit(f"No files found for Docker context: {root}")
              for file in files:
                  digest.update(file.read_bytes())

          add_config(target, set())
          print(digest.hexdigest()[:20])
          PY
          )"

          image="clickhouse/binary-builder:$builder_tag"
          docker pull "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Builder image: $image ($digest)"

      - name: Build the x86-64-v2 binary
        if: steps.metadata.outputs.skip != 'true'
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/build_oldcpu source/artifacts source/tmp/ci-home

          docker run --rm \
              --user "$(id -u):$(id -g)" \
              --ulimit nofile=262144:262144 \
              --env HOME=/ClickHouse/tmp/ci-home \
              --env OPENSSL_CONF=/etc/ssl/openssl.cnf \
              --volume "$GITHUB_WORKSPACE/source:/ClickHouse" \
              --workdir /ClickHouse \
              "$BUILDER_IMAGE" \
              bash -euo pipefail -c '
                  cmake -S /ClickHouse -B /ClickHouse/build_oldcpu -G Ninja \
                      -DCMAKE_BUILD_TYPE=None \
                      -DENABLE_THINLTO=0 \
                      -DSANITIZE= \
                      -DENABLE_CHECK_HEAVY_BUILDS=0 \
                      -DBUILD_STRIPPED_BINARY=1 \
                      -DENABLE_CLICKHOUSE_SELF_EXTRACTING=1 \
                      -DCMAKE_C_COMPILER=clang-22 \
                      -DCMAKE_CXX_COMPILER=clang++-22 \
                      -DCOMPILER_CACHE=disabled \
                      -DCMAKE_TOOLCHAIN_FILE=/ClickHouse/cmake/linux/toolchain-x86_64.cmake \
                      -DENABLE_BUILD_PROFILING=0 \
                      -DENABLE_TESTS=0 \
                      -DENABLE_LEXER_TEST=0 \
                      -DENABLE_UTILS=0 \
                      -DCMAKE_FIND_PACKAGE_NO_PACKAGE_REGISTRY=ON \
                      -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
                      -DDISABLE_ALL_DEBUG_SYMBOLS=1 \
                      -DX86_ARCH_LEVEL=2 \
                      2>&1 | tee /ClickHouse/build_oldcpu/configure.log

                  ninja -C /ClickHouse/build_oldcpu clickhouse \
                      2>&1 | tee /ClickHouse/build_oldcpu/build.log
                  cp /ClickHouse/build_oldcpu/programs/clickhouse \
                      /ClickHouse/build_oldcpu/programs/clickhouse.raw
                  ninja -C /ClickHouse/build_oldcpu clickhouse-bundle \
                      2>&1 | tee -a /ClickHouse/build_oldcpu/build.log
              '

      - name: Verify compatibility and prepare the release asset
        if: steps.metadata.outputs.skip != 'true'
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          grep -qx 'X86_ARCH_LEVEL:STRING=2' source/build_oldcpu/CMakeCache.txt
          file source/build_oldcpu/programs/clickhouse | tee source/build_oldcpu/file.log
          source/build_oldcpu/programs/clickhouse local --query "SELECT version()" \
              2>&1 | tee source/build_oldcpu/test_native.log
          qemu-x86_64 -cpu Westmere source/build_oldcpu/programs/clickhouse.raw \
              local --query "SELECT 1" \
              > source/build_oldcpu/test_westmere.log \
              2> source/build_oldcpu/test_westmere_stderr.log
          cat source/build_oldcpu/test_westmere.log
          cat source/build_oldcpu/test_westmere_stderr.log
          grep -qx 1 source/build_oldcpu/test_westmere.log

          install -m 0755 source/build_oldcpu/programs/clickhouse "source/artifacts/$ASSET_NAME"
          (
              cd source/artifacts
              sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          )
          rm source/build_oldcpu/programs/clickhouse.raw

      - name: Build and test the server image
        if: steps.metadata.outputs.skip != 'true'
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          UPSTREAM_TAG: ${{ steps.metadata.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git -C source rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cp "source/artifacts/$ASSET_NAME" source/artifacts/clickhouse

          docker build \
              --platform linux/amd64 \
              --file automation/docker/oldcpu/Dockerfile \
              --build-arg "CLICKHOUSE_VERSION=$VERSION" \
              --build-arg "BUILD_DATE=$build_date" \
              --build-arg "SOURCE_REVISION=$source_revision" \
              --build-arg "SOURCE_TAG=$UPSTREAM_TAG" \
              --tag clickhouse-oldcpu:test \
              source/artifacts

          docker run --rm --entrypoint /usr/bin/clickhouse clickhouse-oldcpu:test \
              local --query "SELECT 1" | grep -qx 1

          container="$(docker run --detach --rm clickhouse-oldcpu:test)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
              if docker exec "$container" clickhouse client --query "SELECT 1" >/dev/null 2>&1; then
                  ready=1
                  break
              fi
              sleep 1
          done
          docker logs "$container" > source/artifacts/container-test.log 2>&1
          if [[ "$ready" != 1 ]]; then
              cat source/artifacts/container-test.log
              exit 1
          fi
          docker rm --force "$container" >/dev/null
          trap - EXIT

      - name: Publish the GHCR image
        if: steps.metadata.outputs.skip != 'true'
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          SERIES: ${{ steps.metadata.outputs.series }}
          UPSTREAM_TAG: ${{ steps.metadata.outputs.upstream_tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git -C source rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name oldcpu-publisher --use
          docker buildx inspect --bootstrap
          docker buildx build \
              --platform linux/amd64 \
              --file automation/docker/oldcpu/Dockerfile \
              --build-arg "CLICKHOUSE_VERSION=$VERSION" \
              --build-arg "BUILD_DATE=$build_date" \
              --build-arg "SOURCE_REVISION=$source_revision" \
              --build-arg "SOURCE_TAG=$UPSTREAM_TAG" \
              --tag "$IMAGE:$VERSION" \
              --tag "$IMAGE:$SERIES" \
              --tag "$IMAGE:lts" \
              --tag "$IMAGE:latest" \
              --sbom=true \
              --provenance=mode=max \
              --metadata-file source/artifacts/image-metadata.json \
              --push \
              source/artifacts

          image_digest="$(jq -r '."containerimage.digest"' source/artifacts/image-metadata.json)"
          if [[ -z "$image_digest" || "$image_digest" == null ]]; then
              echo "The pushed image digest is missing" >&2
              exit 1
          fi
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null

      - name: Create the GitHub release
        if: steps.metadata.outputs.skip != 'true'
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.metadata.outputs.upstream_tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git -C source rev-parse HEAD)"
          cat > source/artifacts/release-notes.md <<EOF
          Unofficial ClickHouse LTS build for older x86-64 CPUs.

          - Upstream release: [\`$UPSTREAM_TAG\`](https://github.com/ClickHouse/ClickHouse/releases/tag/$UPSTREAM_TAG)
          - Upstream commit: \`$source_revision\`
          - CPU baseline: \`x86-64-v2\` (SSE4.2, SSSE3 and POPCNT; AVX and AVX2 are not required)
          - CMake option: \`X86_ARCH_LEVEL=2\`
          - Build environment: \`$BUILDER_IMAGE\`
          - Container image: \`$IMAGE:$VERSION\`
          - Container digest: \`$IMAGE_DIGEST\`

          The binary was exercised through QEMU with a Westmere CPU model before publication.
          EOF

          gh release create "$RELEASE_TAG" \
              "source/artifacts/$ASSET_NAME#$ASSET_NAME" \
              "source/artifacts/$ASSET_NAME.sha256#$ASSET_NAME.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ClickHouse $VERSION LTS for x86-64-v2" \
              --notes-file source/artifacts/release-notes.md \
              --latest

      - name: Upload diagnostic logs after failure
        if: failure() && steps.metadata.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oldcpu-build-logs-${{ steps.metadata.outputs.version }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            source/build_oldcpu/*.log
            source/artifacts/container-test.log
            source/artifacts/image-metadata.json
